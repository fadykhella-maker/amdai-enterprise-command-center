apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aim-engine-runtime-access
  labels:
    app.kubernetes.io/name: aim-engine
    app.kubernetes.io/component: runtime-access
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
      - servingruntimes
      - clusterservingruntimes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aim-engine-runtime-access
  labels:
    app.kubernetes.io/name: aim-engine
    app.kubernetes.io/component: runtime-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aim-engine-runtime-access
subjects:
  - kind: ServiceAccount
    name: aim-engine-controller-manager
    namespace: aim-system
