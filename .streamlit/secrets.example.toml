# Copy these names into Streamlit Community Cloud > App settings > Secrets.
# Never commit the real values. Generate hashes locally; do not paste passwords here.

# Public HTTPS launch links shown on the deployed dashboard once their health
# check passes (e.g. a Tailscale Funnel hostname). Leave unset to keep the
# tile truthful ("healthy locally; public URL pending") until a real public
# route exists. Only used when AMD_API_URL is itself a public (non-127.0.0.1)
# tunnel endpoint -- local runs fall back to the 127.0.0.1 port-forwards.
AMD_WORKBENCH_URL = "https://REPLACE_WITH_PUBLIC_WORKBENCH_URL"
AMD_RESOURCE_MANAGER_URL = "https://REPLACE_WITH_PUBLIC_RESOURCE_MANAGER_URL"

[auth]
viewer_username = "team-viewer"
viewer_name = "Team Viewer"
viewer_password_hash = "$2b$12$REPLACE_WITH_A_REAL_BCRYPT_HASH"
cookie_name = "amd_eai_viewer"
cookie_key = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
